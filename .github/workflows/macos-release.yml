name: macOS app release

on:
  push:
    tags:
      - "config-v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: macos-app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    defaults:
      run:
        working-directory: apps/macos/AgentpermConfig
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Test
        run: swift test
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/agentperm-config.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          echo "CODE_SIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Configure notarization key
        if: env.HAS_NOTARIZATION == 'true'
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          api_key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$api_key"
          {
            echo "APPLE_API_KEY_PATH=$api_key"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$API_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Require signing and notarization
        run: |
          test "$HAS_SIGNING" = true
          test "$HAS_NOTARIZATION" = true
      - name: Build signed, notarized release
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/package-release.sh "${VERSION#config-v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "dist/Agentperm-Config-${VERSION#config-v}.dmg" \
            "dist/Agentperm-Config-${VERSION#config-v}.zip" \
            "dist/Agentperm Config.alfredworkflow" \
            dist/SHA256SUMS \
            --generate-notes \
            --verify-tag
